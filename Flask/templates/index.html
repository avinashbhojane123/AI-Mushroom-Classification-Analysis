<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Mushroom Classifier</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* No scroll */
      font-family: 'Inter', sans-serif;
      background: #0f2027;
      background: linear-gradient(135deg, #2C5364, #203A43, #0F2027);
      color: #fff;
    }

    .layout {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    .left-panel {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 40px;
    }

    .left-panel h1 {
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 15px;
      color: #00ffc6;
    }

    .left-panel h2 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #ffd166;
      margin-bottom: 25px;
    }

    .left-panel p {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 30px;
      color: #d3d3d3;
    }

    .buttons {
      display: flex;
      gap: 15px;
    }

    .buttons a {
      padding: 12px 28px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .detect-btn {
      background: #06d6a0;
      color: #000;
    }

    .detect-btn:hover {
      background: #05b087;
    }

    .learn-btn {
      background: #118ab2;
      color: #fff;
    }

    .learn-btn:hover {
      background: #0e7490;
    }

    .right-panel {
      flex: 1.2;
      position: relative;
      overflow: hidden;
    }

    .right-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.85);
      transition: transform 0.5s ease;
    }

    .right-panel img:hover {
      transform: scale(1.05);
    }

    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
      }

      .right-panel {
        height: 40vh;
      }

      .left-panel {
        padding: 30px 20px;
        text-align: center;
      }

      .buttons {
        flex-direction: column;
        align-items: center;
      }

      .buttons a {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="layout">
  <div class="left-panel">
    <h1>AI Mushroom Classifier</h1>
    <h2>Explore Safely & Smartly</h2>
    <p>Quickly classify Boletus, Lactarius, and Russula mushrooms using AI-powered vision models trained on global datasets — making mushroom hunting safer and smarter.</p>
    <div class="buttons">
      <a href="{{ url_for('predict_page') }}" class="detect-btn">Start Detection</a>
    \
    </div>
  </div>
  <div class="right-panel">
    <img src="https://plus.unsplash.com/premium_photo-1676762448239-3deac8a7b040?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjV8fG11c2hyb29tJTIwJTIwNGslMjBkYXJrJTIwd2Vic2l0ZXxlbnwwfHwwfHx8MA%3D%3D" alt="Mushroom">
  </div>
</div>

</body>
</html>
